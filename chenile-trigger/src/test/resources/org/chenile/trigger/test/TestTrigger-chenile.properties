chenile.base.url=
chenile.module.name=chenile-trigger-test
chenile.pre.processors=
chenile.post.processors=

chenile.service.json.package=classpath*:org/chenile/trigger/test/service/*.json
chenile.event.json.package=classpath*:org/chenile/trigger/test/event/*.json

chenile.interceptors.path=org/chenile/core/chenile-core.xml
chenile.event.processor=keebootEventProcessor

# small limits so that eviction is exercised in tests if needed
chenile.trigger.dedupe.retention=PT1H
chenile.trigger.dedupe.max-entries=1000
